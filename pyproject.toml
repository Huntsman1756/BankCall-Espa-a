[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankcall-es"
version = "0.1.0"
description = "Reproducible, entity-level historical financial statements for Spanish banks from Banco de España public XBRL data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "duckdb>=1.0",
    "pyarrow>=15",
    "lxml>=5",
    "rich>=13",
]

[project.scripts]
bankcall = "bankcall.cli:app"

[tool.setuptools]
packages = ["bankcall"]
